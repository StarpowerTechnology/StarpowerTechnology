<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exclusive Login — Starpower</title>
  <link rel="stylesheet" href="admin-assets/exclusive-login.css">
  <script src="admin-assets/exclusive-login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <a class="back-link" href="index.html" aria-label="Return to Starpower"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>STARPOWER</span></a>
    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">PRIVATE CONTENT SYSTEM</p>
      <h1 id="login-title">Exclusive Login</h1>
      <p class="intro">Sign in to edit website sections and publish research.</p>
      <form class="login-form" data-login-form>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="64">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <button type="submit">LOG IN</button>
        <p class="form-message" data-login-message role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
